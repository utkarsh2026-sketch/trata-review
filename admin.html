<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRĀTA Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#020713;color:#eafcff;font-family:Arial}.wrap{width:min(1100px,94%);margin:auto;padding:25px}h1{color:#00eaff;letter-spacing:5px}.card{background:#061322;border:1px solid #00d9ff44;border-radius:18px;padding:20px;margin:15px 0}input,button{padding:12px;border-radius:10px;border:1px solid #00d9ff55;background:#071b2b;color:white}.primary{background:#00b8d4;color:#001018;font-weight:bold}.row{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;background:#071b2b;border-radius:12px}.muted{color:#78a5ae;font-size:12px}.review{border-top:1px solid #00d9ff22;padding:18px 0}.stars{color:#00eaff;font-size:20px}@media(max-width:650px){.stats{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>TRĀTA ADMIN</h1><section id="login" class="card"><h2>Admin Access</h2><p class="muted">Enter the administrator password. Your password is hidden while typing.</p><input id="pass" type="password" autocomplete="current-password" placeholder="Admin password" aria-label="Admin password"><button class="primary" onclick="login()">LOGIN</button></section>
<section id="panel" style="display:none"><div class="card"><div class="stats"><div class="stat"><b id="total">0</b><br><span class="muted">Reviews</span></div><div class="stat"><b id="avg">0</b><br><span class="muted">Average rating</span></div><div class="stat"><b id="photos">0</b><br><span class="muted">Photo uploads</span></div></div></div>
<div class="card"><div class="row"><button class="primary" onclick="load()">REFRESH</button><button onclick="csv()">EXPORT CSV</button><button onclick="clearAll()">CLEAR LOCAL DATA</button></div></div><div id="list" class="card"></div></section></div>
<script>
function login(){if(pass.value==='UTKARSH12'){document.getElementById('login').style.display='none';panel.style.display='block';load()}else alert('Incorrect password')}
function get(){return JSON.parse(localStorage.getItem('trata_reviews')||'[]')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function load(){let a=get();total.textContent=a.length;avg.textContent=a.length?(a.reduce((x,r)=>x+r.rating,0)/a.length).toFixed(1):'0';photos.textContent=a.filter(r=>r.photo).length;list.innerHTML=a.slice().reverse().map(r=>`<div class="review"><b>${esc(r.name||'Anonymous')}</b><div class="muted">${new Date(r.created_at).toLocaleString()}</div><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><p>${esc(r.review)}</p>${r.suggestion?'<p><b>Suggestion:</b> '+esc(r.suggestion)+'</p>':''}${r.photo?'<div class="muted">Photo: '+esc(r.photo)+'</div>':''}</div>`).join('')||'<p>No reviews yet.</p>'}
function clearAll(){if(confirm('Clear local review history?')){localStorage.removeItem('trata_reviews');load()}}
function csv(){let a=get(),rows=[['Name','Rating','Review','Suggestion','Created','Photo'],...a.map(r=>[r.name,r.rating,r.review,r.suggestion,r.created_at,r.photo])],s=rows.map(r=>r.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\\n'),u=URL.createObjectURL(new Blob([s],{type:'text/csv'})),x=document.createElement('a');x.href=u;x.download='trata-reviews.csv';x.click();URL.revokeObjectURL(u)}
</script></body></html>
